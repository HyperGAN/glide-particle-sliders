name: CPU integration tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    env:
      CUDA_VISIBLE_DEVICES: ""
      PYTHONDONTWRITEBYTECODE: "1"
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Reject tracked model weights and caches
        run: |
          python - <<'PY'
          from pathlib import PurePosixPath
          import subprocess
          files = subprocess.check_output(["git", "ls-files", "-z"]).decode().split("\0")
          forbidden_dirs = {"artifacts", ".venv", "__pycache__", ".pytest_cache"}
          forbidden_suffixes = {".pt", ".pth", ".safetensors", ".ckpt", ".pkl", ".pickle", ".bin", ".onnx"}
          bad = [name for name in files if name and (
              forbidden_dirs.intersection(PurePosixPath(name).parts)
              or PurePosixPath(name).suffix.lower() in forbidden_suffixes)]
          if bad:
              raise SystemExit("Weight/cache files must not be tracked: " + repr(bad))
          PY
      - name: Install CPU Torch and pinned shared integration
        run: |
          python -m pip install torch==2.9.1 --index-url https://download.pytorch.org/whl/cpu
          # pyproject pins the core Git commit, HNDL version and HyperGAN Git commit.
          python -m pip install '.[test]' pytest==9.2.0 hndl==0.10.0 numpy==2.5.4 Pillow==13.0.0 foldlitedb==0.1.4
      - name: Run synthetic integration and provenance tests
        run: python -m pytest -q
